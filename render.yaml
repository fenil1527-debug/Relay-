services:
  - type: web
    name: relay-studio
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: OPENAI_COMPAT_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_COMPAT_API_KEY
        sync: false
      - key: OPENAI_COMPAT_MODEL
        value: openai/gpt-oss-120b
      - key: ENABLE_SIMULATION
        value: "true"
